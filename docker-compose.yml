version: "3.8"

# Weaviate vector database for SDLC Agent Framework.
#
# Usage:
#   make docker-start PROJECT=myapp    # start
#   make docker-stop                   # stop
#   make docker-status                 # check status
#
# Or directly:
#   WEAVIATE_PORT=8090 WEAVIATE_DATA_DIR=~/.weaviate-myapp/data docker compose up -d

services:
  weaviate:
    image: semitechnologies/weaviate:${WEAVIATE_VERSION:-1.28.4}
    container_name: sdlc-weaviate
    restart: unless-stopped
    ports:
      - "${WEAVIATE_PORT:-8090}:8080"
      - "${WEAVIATE_GRPC_PORT:-8091}:50051"
    volumes:
      - ${WEAVIATE_DATA_DIR:-weaviate-data}:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  weaviate-data:
    driver: local
